  <div class="layout">

        <div class="navbar-brand">
          <img src="Assets/Images/JONAS2.JPG" alt="Lindani Jonase" class="navbar-avatar" />
          <span class="navbar-name">Lindani Jonase</span>
        </div>

        <!-- Desktop Navigation Links -->
        <ul class="navbar-links" id="navbarLinks">
          <li><a href="index.html" class="navbar-link">
            <svg class="navbar-icon" role="img" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <span>Home</span>
          </a></li>
          <li><a href="about.html" class="navbar-link">
            <svg class="navbar-icon" role="img" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span>About</span>
          </a></li>
          <li><a href="portfolio.html" class="navbar-link">
            <svg class="navbar-icon" role="img" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M20 6h-2l-2-2H8L6 6H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
            </svg>
            <span>Portfolio</span>
          </a></li>
          <li><a href="blog.html" class="navbar-link">
            <svg class="navbar-icon" role="img" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
            <span>Blog</span>
          </a></li>
          <li><a href="services.html" class="navbar-link">
            <svg class="navbar-icon" role="img" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            <span>Services</span>
          </a></li>
          <li><a href="contact.html" class="navbar-link active">
            <svg class="navbar-icon" role="img" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            <span>Contact</span>

        </ul>

        <!-- Theme Toggle & Clock -->
        <div class="navbar-actions">
          <div class="navbar-clock" id="navbarClock" title="Current Time">--:--:--</div>
          <button id="themeToggle" class="navbar-theme-toggle" aria-label="Toggle theme">
            <svg class="theme-icon" role="img" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>

            <span id="themeToggleLabel">Dark Mode</span>
          </button>

        <!-- Mobile Menu Toggle -->
        <button class="navbar-toggle" id="navbarToggle" aria-expanded="false" aria-controls="navbarLinks" aria-label="Toggle navigation menu">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </nav>
    <div class="main-content" style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;">
      <section class="hero-section animate-fade-in" style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;">
        <div class="hero-blur-bg"></div>
        <h1 class="hero-title" style="text-align:center;margin-bottom:2rem;">Contact Me</h1>
        <h2 style="font-size:1.5rem;margin-bottom:2rem;text-align:center;">Open for Opportunities — Let's Connect!</h2>
        
        <!-- Social Media Icons Section -->
        <div class="contact-socials" style="display:flex;justify-content:center;gap:2rem;margin-bottom:2rem;">
          <a href="https://linkedin.com/in/lindani-jonase-368515304" target="_blank" aria-label="LinkedIn" class="contact-social-icon" style="font-size:2rem;color:#0077b5;transition:transform 0.2s;"><i class="fab fa-linkedin"></i></a>
          <a href="https://github.com/lindanijay" target="_blank" aria-label="GitHub" class="contact-social-icon" style="font-size:2rem;color:#333;transition:transform 0.2s;"><i class="fab fa-github"></i></a>
          <a href="mailto:lindanijonase@gmail.com" aria-label="Email" class="contact-social-icon" style="font-size:2rem;color:#ea4335;transition:transform 0.2s;"><i class="fas fa-envelope"></i></a>
        </div>
        
        <div class="glass-card animate-fade-in" style="--fade-in-delay:0.1s;max-width:600px;margin:0 auto;background:rgba(60,60,60,0.3);backdrop-filter:blur(15px);border:1px solid rgba(255,224,102,0.3);border-radius:1rem;padding:2rem;">
          <form action="https://formspree.io/f/xqaqrolr" method="POST" class="contact-form">
            <div class="form-group">
              <input type="text" name="name" class="form-input" placeholder="Your Name" required />
              <div class="form-error"></div>
            </div>
            
            <div class="form-group">
              <input type="email" name="email" class="form-input" placeholder="Your Email" required />
              <div class="form-error"></div>
            </div>
            
            <div class="form-group">
              <input type="text" name="subject" class="form-input" placeholder="Subject (Optional)" />
              <div class="form-error"></div>
            </div>
            
            <div class="form-group">
              <textarea name="message" class="form-input" placeholder="Your Message" required rows="5" style="resize: vertical;"></textarea>
              <div class="form-error"></div>
            </div>
            
            <button type="submit" class="btn" style="width: 100%; justify-content: center; position: relative;background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:white;padding:1rem;border-radius:0.75rem;font-weight:600;transition:all 0.3s ease;">
              <span class="btn-text">Send Message</span>
            </button>
          </form>
        </div>
        
      </section>
    </div>
  </div>
  <script src="js/sidebar.js"></script>
  <script src="js/enhanced-features.js"></script>
  <script src="js/advanced-features.js"></script>
</body>
</html>
