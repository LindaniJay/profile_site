    <div class="main-content">
      <section class="hero-section animate-fade-in">
        <div class="hero-blur-bg"></div>

        <!-- Blog Search and Categories -->
        <div class="glass-card blog-search-card">
          <div class="blog-search-container">
            <div class="search-input-container">
              <input type="text" id="blogSearch" placeholder="Search blog posts..." class="blog-search-input">
            </div>
            <div class="blog-filter-buttons">
              <button class="filter-btn active" data-category="all">All Posts</button>
              <button class="filter-btn" data-category="web-development">Web Dev</button>
              <button class="filter-btn" data-category="tutorials">Tutorials</button>
              <button class="filter-btn" data-category="projects">Projects</button>
            </div>
          </div>
        </div>
        
        <div class="blog-content-container">
          <div class="glass-card animate-fade-in blog-card" id="blogCard" style="--fade-in-delay:0.1s;">
            <div id="blogContentShort">
              <!-- Short/truncated content will be injected by JS -->
            </div>
            <div id="blogContentFull" style="display:none;">
              <!-- Full content will be injected by JS -->
            </div>
            <button id="seeMoreBtn" class="btn btn-outline" style="margin-top:1.5rem;">See more</button>
          </div>
        </div>
      </section>
    </div>
  </div>
  <!-- Back to Top Button -->
  <button id="backToTopBtn" title="Back to top">⬆️</button>
  <script src="https://kit.fontawesome.com/4adad1b6e0.js" crossorigin="anonymous"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/enhanced-features.js"></script>
  <script>
  // Blog post content as plain text (for truncation)
  const blogFullText = `Building My Modern Portfolio Website: A South African Developer's Journey\n\nA behind-the-scenes look at designing, developing, and modernizing my interactive portfolio website as a South African software engineer.\n\nProject Vision\n- Visually striking dark theme with navy, black, and deep accent colours\n- Highly interactive: live weather dashboard, animated backgrounds, smooth transitions\n- Professional & personal: formal intro, detailed about, portfolio of latest projects\n- Responsive & accessible for all devices, optimised for South African internet conditions\n\nKey Features\n- Modern Dark Theme: Custom palette, gradients, glassmorphism, and video backgrounds\n- Sidebar Navigation: Fixed, collapsible, with icons and live clock\n- Home & About: Formal intro, skills, and a modern card layout\n- Portfolio Showcase: Latest projects in stylish cards\n- Weather Dashboard: Real-time data for South African cities, animated backgrounds, 5-day forecast, geolocation, robust error handling\n- Blog & Contact: Technical articles and a modern contact form\n- Game Page: A fun, interactive JavaScript game\n\nTech Stack\n- HTML5: Semantic, accessible markup\n- CSS3: Custom properties, Flexbox, Grid, glassmorphism, gradients, and video backgrounds\n- Vanilla JavaScript (ES6+): All interactivity, API integration, geolocation, and animations (no React or frameworks)\n- OpenWeatherMap API: Real-time weather data (current, hourly, 5-day) for South African cities\n- FontAwesome: Crisp, scalable icons\n- Responsive Design: Media queries and flexible layouts for all devices\n- Assets: Custom images, profile photos, and a looping background video\n\nDebugging & Modernisation\n- Checked all image/script links, set up linter, improved accessibility, and optimised performance\n- Removed outdated elements, unified all pages, and added animated/video backgrounds\n\nChallenges & Solutions\n- Weather API integration: geolocation for South African cities, error handling, and data formatting\n- Animated backgrounds: balancing visual appeal with readability and performance\n- Responsiveness: ensuring a great look on all devices, including slower connections\n\nFinal Thoughts\nThis project blends design, interactivity, and real-world data into a single, cohesive portfolio. The result is a site that not only showcases my work but also demonstrates my ability to build modern, user-friendly web applications that work well in the South African context.\n\nCheck it out, explore the weather dashboard, and let me know what you think!\n\nIf you have any questions about the build process, want to collaborate, or just want to say hi, feel free to reach out via the contact page!`;
  const charLimit = 300;
  const blogContentShort = document.getElementById('blogContentShort');
  const blogContentFull = document.getElementById('blogContentFull');
  const seeMoreBtn = document.getElementById('seeMoreBtn');

  function formatBlogText(text) {
    // Simple formatter: paragraphs and line breaks
    return text.split('\n').map(line => {
      if (line.startsWith('- ')) return `<li>${line.slice(2)}</li>`;
      if (line.trim() === '') return '';
      if (line.endsWith(':')) return `<h3 style='color:#ffe066;margin-top:1.2rem;'>${line}</h3>`;
      return `<p>${line}</p>`;
    }).join('');
  }

  const shortText = blogFullText.slice(0, charLimit) + '...';
  blogContentShort.innerHTML = formatBlogText(shortText);
  blogContentFull.innerHTML = formatBlogText(blogFullText);

  seeMoreBtn.addEventListener('click', function() {
    if (blogContentFull.style.display === 'none') {
      blogContentFull.style.display = '';
      blogContentShort.style.display = 'none';
      seeMoreBtn.textContent = 'See less';
    } else {
      blogContentFull.style.display = 'none';
      blogContentShort.style.display = '';
      seeMoreBtn.textContent = 'See more';
    }
  });

  // Back to Top button logic
  const backToTopBtn = document.getElementById('backToTopBtn');
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
      backToTopBtn.style.display = 'block';
    } else {
      backToTopBtn.style.display = 'none';
    }
  });
  backToTopBtn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  
  // Remove any existing accessibility buttons immediately and on DOM load
  function removeAccessibilityButtons() {
    const skipLink = document.querySelector('.skip-link');
    const highContrastToggle = document.querySelector('.high-contrast-toggle');
    
    if (skipLink) {
      skipLink.remove();
    }
    
    if (highContrastToggle) {
      highContrastToggle.remove();
    }
  }
  
  // Run immediately
  removeAccessibilityButtons();
  
  // Run on DOM load
  document.addEventListener('DOMContentLoaded', removeAccessibilityButtons);
  
  // Run after a short delay to catch any dynamically added buttons
  setTimeout(removeAccessibilityButtons, 100);
  </script>
</body>
